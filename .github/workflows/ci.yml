name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 10.18.3 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Block deployable dependency vulnerabilities. Development-only lint tooling
      # currently includes braces@3.0.3 through eslint-config-next; its advisory has
      # no patched release and the package is not shipped with the application.
      - run: pnpm audit --prod --audit-level high
